version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "queries/users.sql"
      - "queries/services.sql"
      - "queries/requests.sql"
      - "queries/items.sql"
      - "queries/bookings.sql"
    schema: "migrations/init.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/storage/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
