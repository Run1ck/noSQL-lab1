services:
  redis:
    image: redis:7-alpine
    container_name: booking-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      # Только localhost: пароля нет, наружу Redis не светим.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18.6
    container_name: booking-postgres
    shm_size: 256mb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ../postgres/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    ports:
      - 9000:8080

volumes:
  redis-data:
