<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Booking</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="nav"></header>
  <main class="container auth-wrap">
    <section class="auth-card glass">
      <h1>Добро пожаловать</h1>
      <p class="muted">Бронируйте аудитории, лаборатории и оборудование.</p>
      <div class="tabs" role="tablist">
        <button type="button" class="active" data-mode="login" role="tab">Вход</button>
        <button type="button" data-mode="register" role="tab">Регистрация</button>
      </div>
      <form class="form" id="auth-form" novalidate>
        <label class="field">Логин
          <input class="input" name="login" autocomplete="username" required>
        </label>
        <label class="field">Пароль
          <input class="input" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="form-error" id="form-error" role="alert"></div>
        <button class="btn primary block" type="submit" id="submit">Войти</button>
      </form>
    </section>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
